name: Paper

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Figuras SVG a PDF (para LaTeX)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-dejavu-core
          for f in paper/figuras/*.svg; do rsvg-convert -f pdf -o "${f%.svg}.pdf" "$f"; done

      - name: Compilar paper.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paper.tex
          working_directory: paper

      - name: Sin referencias ni citas sin resolver
        run: |
          if grep -nE "(Reference|Citation) .* undefined|There were undefined references|Empty bibliography" paper/paper.log; then
            echo "::error::El PDF tiene referencias o citas sin resolver"
            exit 1
          fi

      - name: Versión web
        run: python3 paper/web.py

      - name: Commit del PDF y de la versión web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/paper.pdf index.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Compilar paper.pdf y versión web [skip ci]"
            git push
          fi

      - name: Publicar en GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
